name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Committed-key check
        # Runs first and standalone (no deps) so a leaked key fails fast, even
        # if install breaks. Matches hb_[0-9a-f]{32}.
        run: bash scripts/check-no-keys.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        # Live tests (*.live.test.ts) are excluded unless HB_LIVE=1, so CI needs
        # no network and no credentials.
        run: pnpm test
